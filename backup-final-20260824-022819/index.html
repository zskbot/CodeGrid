<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CodeGrid</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#eee;
}

body{
  font-family:
    "JetBrains Mono",
    "Roboto Mono",
    monospace;
}

button,
input,
textarea{
  font:inherit;
}

button{
  color:inherit;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#000;
}

#topbar{
  height:42px;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #1b1b1b;
  background:#050505;
  user-select:none;
}

#menuBtn{
  position:absolute;
  left:8px;
  top:7px;
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:20px;
  line-height:28px;
  padding:0;
}

#topStatus{
  position:absolute;
  right:10px;
  color:#777;
  font-size:10px;
}

#sideMenu{
  position:fixed;
  z-index:1000;
  top:42px;
  left:0;
  bottom:0;
  width:270px;
  max-width:85vw;
  background:#050505;
  border-right:1px solid #222;
  transform:translateX(-100%);
  transition:transform .18s ease;
  display:flex;
  flex-direction:column;
  padding:10px 8px;
}

#sideMenu.open{
  transform:translateX(0);
}

#menuTitle{
  padding:10px 9px 14px;
  color:#fff;
  font-size:15px;
  font-weight:700;
}

.menuItem{
  width:100%;
  min-height:48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  gap:2px;
  padding:7px 10px;
  border:0;
  border-left:2px solid transparent;
  background:#050505;
  color:#ddd;
  text-align:left;
}

.menuItem span{
  font-size:13px;
}

.menuItem small{
  color:#666;
  font-size:10px;
}

.menuItem.active{
  background:#111;
  border-left-color:#fff;
  color:#fff;
}

.menuItem.active small{
  color:#888;
}

.menuItem:active{
  background:#181818;
}

.menuDivider{
  height:1px;
  background:#1b1b1b;
  margin:8px 2px;
}

.menuBottom{
  margin-top:auto;
  padding:12px 10px;
  border-top:1px solid #181818;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.menuBottom span{
  font-size:11px;
  color:#aaa;
}

.menuBottom small{
  font-size:9px;
  color:#555;
}

#menuBackdrop{
  position:fixed;
  z-index:999;
  inset:42px 0 0 0;
  background:rgba(0,0,0,.55);
  display:none;
}

#menuBackdrop.open{
  display:block;
}

#logo{
  font-size:14px;
  font-weight:700;
}

#workspace{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.panel{
  display:none;
  flex:1;
  min-height:0;
}

.panel.active{
  display:flex;
}

#terminalPanel{
  flex-direction:column;
}

#terminal{
  flex:1;
  min-height:0;
  position:relative;
  background:#000;
}

#shellText{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:9px 8px;
  border:0;
  outline:0;
  resize:none;

  background:#000;
  color:#e7e7e7;

  font-family:
    "JetBrains Mono",
    "Roboto Mono",
    "DejaVu Sans Mono",
    monospace;

  font-size:14px;
  line-height:1.45;

  white-space:pre;
  overflow:auto;

  caret-color:#fff;

  user-select:text;
  -webkit-user-select:text;
  -webkit-touch-callout:default;

  touch-action:auto;

  -webkit-appearance:none;
  appearance:none;
}

#shellText::selection{
  background:#315f9f;
  color:#fff;
}

#shellText::-webkit-scrollbar{
  width:4px;
}

#shellText::-webkit-scrollbar-thumb{
  background:#333;
}

#filesPanel,
#editorPanel,
#previewPanel{
  overflow:auto;
  padding:10px;
}

.sectionTitle{
  font-size:12px;
  color:#888;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.file{
  display:flex;
  width:100%;
  padding:9px 7px;
  border:0;
  border-bottom:1px solid #151515;
  background:#000;
  text-align:left;
  color:#ddd;
}

.file:hover{
  background:#101010;
}

#editor{
  width:100%;
  flex:1;
  min-height:0;
  resize:none;
  border:1px solid #181818;
  outline:0;
  background:#020202;
  color:#eee;
  padding:10px;
  font-size:13px;
  line-height:1.5;
  white-space:pre;
}

#previewFrame{
  width:100%;
  height:100%;
  min-height:300px;
  border:1px solid #181818;
  background:#fff;
}

#bottom{
  height:44px;
  min-height:44px;
  display:flex;
  border-top:1px solid #181818;
  background:#050505;
}

.tab{
  flex:1;
  border:0;
  background:#050505;
  color:#777;
  font-size:11px;
}

.tab.active{
  color:#fff;
  background:#111;
}

#editorActions{
  display:flex;
  gap:6px;
  margin-bottom:8px;
}

.action{
  border:1px solid #242424;
  background:#0b0b0b;
  padding:7px 10px;
  font-size:11px;
}

#filePath{
  flex:1;
  min-width:0;
  border:1px solid #242424;
  background:#050505;
  color:#ddd;
  padding:7px;
  outline:0;
  font-size:11px;
}

@media(min-width:800px){
  #workspace{
    display:grid;
    grid-template-columns:220px 1fr 360px;
    grid-template-rows:1fr 260px;
  }

  #filesPanel{
    display:flex;
    flex-direction:column;
    grid-row:1 / 3;
    border-right:1px solid #181818;
  }

  #editorPanel{
    display:flex;
    flex-direction:column;
    border-right:1px solid #181818;
  }

  #previewPanel{
    display:flex;
    flex-direction:column;
  }

  #terminalPanel{
    display:flex;
    grid-column:2 / 4;
    border-top:1px solid #181818;
  }

  #bottom{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app">

  <header id="topbar">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <div id="logo">Shell CodeGrid</div>
    <div id="topStatus">●</div>
  </header>

  <aside id="sideMenu">
    <div id="menuTitle">CodeGrid</div>

    <button class="menuItem active" data-panel="terminalPanel">
      <span>Terminal</span>
      <small>Shell</small>
    </button>

    <button class="menuItem" data-panel="filesPanel">
      <span>Files</span>
      <small>Workspace</small>
    </button>

    <button class="menuItem" data-panel="editorPanel">
      <span>Editor</span>
      <small>Code</small>
    </button>

    <button class="menuItem" data-panel="previewPanel">
      <span>Preview</span>
      <small>Web App</small>
    </button>

    <div class="menuDivider"></div>

    <button class="menuItem" onclick="alert('GitHub — sẵn sàng kết nối')">
      <span>GitHub</span>
      <small>Repository</small>
    </button>

    <button class="menuItem" onclick="alert('Workspace: ~/CodeGrid')">
      <span>Workspace</span>
      <small>~/CodeGrid</small>
    </button>

    <div class="menuBottom">
      <span>CodeGrid</span>
      <small>Web IDE</small>
    </div>
  </aside>

  <div id="menuBackdrop"></div>

  <main id="workspace">

    <section id="filesPanel" class="panel">
      <div class="sectionTitle">Files</div>
      <div id="fileTree"></div>
    </section>

    <section id="editorPanel" class="panel">
      <div id="editorActions">
        <input id="filePath" placeholder="file path">
        <button class="action" id="saveBtn">Save</button>
      </div>

      <textarea
        id="editor"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    </section>

    <section id="previewPanel" class="panel">
      <div class="sectionTitle">Preview</div>
      <iframe id="previewFrame" src="/preview/"></iframe>
    </section>

    <section id="terminalPanel" class="panel active">
      <div id="terminal">
        <textarea
          id="shellText"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="off"
          autocomplete="off"
          wrap="off"
          aria-label="CodeGrid Shell"
        ></textarea>
      </div>
    </section>

  </main>



</div>

<script>
const shellText =
  document.getElementById("shellText");

const socketUrl =
  (location.protocol === "https:" ? "wss://" : "ws://") +
  location.host;

let socket = null;


/*
 * TERMINAL
 *
 * Output nằm trong textarea để Android có native
 * selection/copy/paste.
 *
 * Browser tuyệt đối không được tự sửa transcript.
 * Mọi phím đều được gửi xuống PTY.
 */

function stripAnsi(text){

  return String(text)
    .replace(/\x1B\][0-?]*[ -/]*[@-~]/g,"")
    .replace(/\x1B\[[0-?]*[ -/]*[@-~]/g,"")
    .replace(/\x1B[()][0-2A-Z]/g,"")
    .replace(/\x1B[@-_]/g,"");
}

function cleanOutput(data){

  let text = stripAnsi(data);

  /*
   * Chỉ ẩn initialize_job_control.
   */
  text = text.replace(
    /[^\r\n]*initialize_job_control[^\r\n]*(?:\r?\n|$)/gi,
    ""
  );

  /*
   * Không hiển thị banner dài.
   */
  text = text.replace(
    /CodeGrid Web Shell[^\r\n]*(?:\r?\n|$)/gi,
    ""
  );

  text = text.replace(
    /Workspace:[^\r\n]*(?:\r?\n|$)/gi,
    ""
  );

  /*
   * Hiển thị đường dẫn gọn.
   */
  text = text.replace(
    /\/data\/data\/com\.termux\/files\/home\/CodeGrid\/workspace/g,
    "~/CodeGrid"
  );

  text = text.replace(
    /~\/CodeGrid\/workspace/g,
    "~/CodeGrid"
  );

  return text;
}

function appendOutput(data){

  const text = cleanOutput(data);

  if(!text) return;

  shellText.value += text;

  shellText.selectionStart =
    shellText.value.length;

  shellText.selectionEnd =
    shellText.value.length;

  shellText.scrollTop =
    shellText.scrollHeight;
}

function sendInput(data){

  if(
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ){
    return;
  }

  socket.send(
    JSON.stringify({
      type:"input",
      data
    })
  );
}

function connectShell(){

  socket = new WebSocket(socketUrl);
  socket.binaryType = "arraybuffer";

  socket.onopen = () => {

    shellText.focus();

    socket.send(
      JSON.stringify({
        type:"resize",
        cols:Math.max(
          20,
          Math.floor(shellText.clientWidth / 8)
        ),
        rows:Math.max(
          8,
          Math.floor(shellText.clientHeight / 20)
        )
      })
    );
  };

  socket.onmessage = event => {

    if(typeof event.data === "string"){

      const message =
        JSON.parse(event.data);

      if(message.type === "output"){
        appendOutput(message.data);
      }

      return;
    }

    const decoder =
      new TextDecoder();

    appendOutput(
      decoder.decode(
        new Uint8Array(event.data)
      )
    );
  };

  socket.onclose = () => {

    setTimeout(connectShell,1500);
  };
}


/*
 * KEYBOARD
 *
 * Không cho textarea tự xóa.
 *
 * Backspace → PTY
 * Delete    → PTY
 * Enter     → PTY
 * Tab       → PTY
 * Ctrl+C    → PTY
 * Ctrl+D    → PTY
 * Arrow     → PTY
 */

shellText.addEventListener(
  "keydown",
  event => {

    if(
      !socket ||
      socket.readyState !== WebSocket.OPEN
    ){
      return;
    }

    /*
     * Không can thiệp khi đang dùng native
     * selection/copy.
     */
    if(
      event.ctrlKey &&
      ["c","x"].includes(
        event.key.toLowerCase()
      ) &&
      shellText.selectionStart !==
      shellText.selectionEnd
    ){
      return;
    }

    const key = event.key;

    const map = {
      Enter:"\r",
      Backspace:"\x7f",
      Delete:"\x1b[3~",
      Tab:"\t",
      ArrowUp:"\x1b[A",
      ArrowDown:"\x1b[B",
      ArrowRight:"\x1b[C",
      ArrowLeft:"\x1b[D",
      Home:"\x1b[H",
      End:"\x1b[F",
      PageUp:"\x1b[5~",
      PageDown:"\x1b[6~",
      Escape:"\x1b"
    };

    /*
     * Ctrl keys.
     */
    if(event.ctrlKey){

      const lower =
        key.toLowerCase();

      if(
        lower >= "a" &&
        lower <= "z"
      ){

        event.preventDefault();

        sendInput(
          String.fromCharCode(
            lower.charCodeAt(0) - 96
          )
        );

        return;
      }
    }

    if(map[key]){

      event.preventDefault();

      sendInput(map[key]);

      return;
    }

    /*
     * Android keyboard có thể gửi IME qua
     * beforeinput.
     */
  }
);


/*
 * beforeinput:
 * chặn browser tự chèn/xóa text.
 */
shellText.addEventListener(
  "beforeinput",
  event => {

    if(
      !socket ||
      socket.readyState !== WebSocket.OPEN
    ){
      event.preventDefault();
      return;
    }

    if(
      event.inputType === "insertText" ||
      event.inputType === "insertCompositionText"
    ){

      event.preventDefault();

      if(event.data){
        sendInput(event.data);
      }

      return;
    }

    if(
      event.inputType === "insertFromPaste"
    ){

      event.preventDefault();

      const text =
        event.data ||
        "";

      if(text){
        sendInput(text);
      }

      return;
    }

    /*
     * Không cho browser tự delete transcript.
     * Backspace/Delete đã được xử lý bằng keydown.
     */
    if(
      event.inputType === "deleteContentBackward" ||
      event.inputType === "deleteContentForward"
    ){

      event.preventDefault();

      return;
    }

    if(
      event.inputType === "insertLineBreak"
    ){

      event.preventDefault();

      sendInput("\r");
    }
  }
);


/*
 * Paste fallback.
 */
shellText.addEventListener(
  "paste",
  event => {

    event.preventDefault();

    const text =
      event.clipboardData
        ? event.clipboardData.getData("text")
        : "";

    if(text){
      sendInput(text);
    }
  }
);


/*
 * IME / Android composition.
 */
shellText.addEventListener(
  "compositionend",
  event => {

    if(event.data){
      sendInput(event.data);
    }
  }
);


/*
 * Resize PTY.
 */
window.addEventListener(
  "resize",
  () => {

    if(
      !socket ||
      socket.readyState !== WebSocket.OPEN
    ){
      return;
    }

    socket.send(
      JSON.stringify({
        type:"resize",
        cols:Math.max(
          20,
          Math.floor(shellText.clientWidth / 8)
        ),
        rows:Math.max(
          8,
          Math.floor(shellText.clientHeight / 20)
        )
      })
    );
  }
);


/*
 * FILES
 */

const fileTree =
  document.getElementById("fileTree");

const editor =
  document.getElementById("editor");

const filePath =
  document.getElementById("filePath");

async function loadFiles(){

  const response =
    await fetch("/api/files");

  const data =
    await response.json();

  fileTree.innerHTML = "";

  function render(items){

    for(const item of items){

      const button =
        document.createElement("button");

      button.className = "file";

      button.textContent =
        (item.type === "directory" ? "▸ " : "• ") +
        item.name;

      fileTree.appendChild(button);

      if(item.type === "file"){

        button.onclick = () =>
          openFile(item.path);
      }

      if(item.type === "directory"){

        render(item.children || []);
      }
    }
  }

  render(data.files || []);
}

async function openFile(path){

  const response =
    await fetch(
      "/api/file?path=" +
      encodeURIComponent(path)
    );

  const data =
    await response.json();

  if(!data.ok){
    alert(data.error);
    return;
  }

  filePath.value = path;
  editor.value = data.content;

  showPanel("editorPanel");
}

document
  .getElementById("saveBtn")
  .onclick = async () => {

    const response =
      await fetch("/api/file",{
        method:"PUT",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          path:filePath.value,
          content:editor.value
        })
      });

    const data =
      await response.json();

    if(!data.ok){
      alert(data.error);
      return;
    }

    loadFiles();
  };


/*
 * MOBILE TABS
 */

function showPanel(id){

  document
    .querySelectorAll(".panel")
    .forEach(panel => {
      panel.classList.toggle(
        "active",
        panel.id === id
      );
    });

  document
    .querySelectorAll(".tab")
    .forEach(tab => {
      tab.classList.toggle(
        "active",
        tab.dataset.panel === id
      );
    });

  if(id === "terminalPanel"){
    setTimeout(
      () => shellText.focus(),
      50
    );
  }
}

document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.onclick = () =>
      showPanel(tab.dataset.panel);
  });


/*
 * NAVIGATION MENU
 */

const menuBtn =
  document.getElementById("menuBtn");

const sideMenu =
  document.getElementById("sideMenu");

const menuBackdrop =
  document.getElementById("menuBackdrop");

function closeMenu(){
  sideMenu.classList.remove("open");
  menuBackdrop.classList.remove("open");
}

function openMenu(){
  sideMenu.classList.add("open");
  menuBackdrop.classList.add("open");
}

menuBtn.onclick = () => {

  if(sideMenu.classList.contains("open")){
    closeMenu();
  }else{
    openMenu();
  }
};

menuBackdrop.onclick = closeMenu;

document
  .querySelectorAll(".menuItem[data-panel]")
  .forEach(item => {

    item.onclick = () => {

      showPanel(item.dataset.panel);

      document
        .querySelectorAll(".menuItem")
        .forEach(x =>
          x.classList.remove("active")
        );

      item.classList.add("active");

      closeMenu();
    };
  });

/*
 * START
 */

loadFiles();
connectShell();

</script>

</body>
</html>
